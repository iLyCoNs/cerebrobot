<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cerebro</title>
<style>
  :root {
    --bg: #0c0c0c;
    --fg: #d7d7d7;
    --dim: #5c5c5c;
    --faint: #3a3a3a;
    --line: #1d1d1d;
    --accent: #7aa2f7;
    --warn: #e0af68;
    --err: #f7768e;
    --ok: #9ece6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    font-size: 13.5px; line-height: 1.6;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  #top {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 8px 18px; border-bottom: 1px solid var(--line);
    white-space: nowrap; overflow: hidden;
  }
  #top .name { font-weight: 700; color: var(--fg); }
  #top .sub { color: var(--dim); margin-left: 8px; font-size: 12px; }
  #top .models { color: var(--dim); font-size: 12px; }
  #top .models .cool { color: var(--warn); }

  #log { flex: 1; overflow-y: auto; padding: 18px 18px 24px; }
  .col { max-width: 860px; margin: 0 auto; }
  .block { margin-bottom: 18px; }
  .who { color: var(--dim); font-size: 12px; margin-bottom: 2px; }
  .who .mark { color: var(--accent); }
  .who.you .mark { color: var(--fg); }
  .text { white-space: pre-wrap; word-break: break-word; }
  .text.err { color: var(--err); }
  .text.dim { color: var(--dim); }

  .line { color: var(--dim); font-size: 12.5px; padding-left: 14px; margin: 2px 0; }
  .line .b { color: var(--faint); }
  .line .t { color: var(--accent); }
  .line .sp { color: #bb9af7; }
  .line .arg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line.done::before { content: "✓ "; color: var(--faint); }
  .line.run::before { content: "◌ "; color: var(--accent); }

  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 4px; }
  #log::-webkit-scrollbar-track { background: transparent; }

  #status {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 4px 18px; border-top: 1px solid var(--line);
    color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden;
  }
  #status .ok { color: var(--ok); }
  #status .warn { color: var(--warn); }

  #composer {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 18px 14px; border-top: 1px solid var(--line);
  }
  .prompt-mark { color: var(--accent); padding-top: 2px; user-select: none; }
  textarea {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--fg); font: inherit; line-height: 1.6; max-height: 34vh;
    caret-color: var(--accent);
  }
  textarea::placeholder { color: var(--faint); }
  .hint { color: var(--faint); font-size: 11px; padding-top: 3px; user-select: none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div><span class="name">cerebro</span><span class="sub">agente autónomo · nvidia</span></div>
    <div class="models" id="topModels">…</div>
  </div>

  <div id="log"><div class="col" id="thread"></div></div>

  <div id="status">
    <span id="statusLeft">conectando…</span>
    <span id="statusRight">127.0.0.1:8000</span>
  </div>

  <div id="composer">
    <span class="prompt-mark">❯</span>
    <textarea id="input" rows="1" placeholder="escribe una tarea… /ayuda para comandos" autofocus></textarea>
    <span class="hint">enter enviar · shift+enter línea</span>
  </div>
</div>

<script>
const thread = document.getElementById("thread");
const log = document.getElementById("log");
const input = document.getElementById("input");
const busyState = { on: false };

function scroll() { log.scrollTop = log.scrollHeight; }
function heroOff() {
  const h = document.getElementById("hero");
  if (h) h.remove();
}

function block(who, text, cls) {
  heroOff();
  const b = document.createElement("div");
  b.className = "block";
  const w = document.createElement("div");
  w.className = "who" + (who === "❯ tú" ? " you" : "");
  w.innerHTML = `<span class="mark">${who === "❯ tú" ? "❯" : "◆"}</span> ${who.replace(/^[^ ]+ /, "")}`;
  const t = document.createElement("div");
  t.className = "text" + (cls ? " " + cls : "");
  t.textContent = text;
  b.append(w, t);
  thread.append(b);
  scroll();
  return b;
}

function line(html, cls) {
  const l = document.createElement("div");
  l.className = "line" + (cls ? " " + cls : "");
  l.innerHTML = html;
  thread.append(l);
  scroll();
  return l;
}

const SPIN = ["⠋", "⠙", "⠹", "⠸", "⠼", "⠴", "⠦", "⠧", "⠇", "⠏"];
let thinkLine = null, thinkTimer = null;
function thinkStart(text) {
  heroOff();
  thinkLine = line(`<span class="t">${SPIN[0]}</span> <span class="arg">${text || "pensando · consultando nvidia"}</span>`);
  let i = 0;
  thinkTimer = setInterval(() => {
    i = (i + 1) % SPIN.length;
    const el = thinkLine?.querySelector(".t");
    if (el) el.textContent = SPIN[i];
  }, 90);
}
function thinkStop() {
  clearInterval(thinkTimer);
  thinkLine?.remove();
  thinkLine = null;
}

function toolLine(name, args) {
  thinkStop();
  const a = typeof args === "object" ? JSON.stringify(args) : String(args || "");
  const cls = name === "spawn" ? "run" : "done";
  const label = name === "spawn" ? `<span class="sp">spawn</span>` : `<span class="t">${name}</span>`;
  return line(`${label} <span class="arg">${escapeHtml(a).slice(0, 120)}</span>`, cls);
}

function noteLine(text, cls) {
  thinkStop();
  return line(escapeHtml(text), cls);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function refreshStatus() {
  try {
    const data = await (await fetch("/api/status")).json();
    const cooling = data.models_cooling || {};
    const models = data.models.map(m =>
      cooling[m] ? `<span class="cool">${m.split("/").pop()} ${Math.round(cooling[m])}s</span>` : m.split("/").pop()
    ).join(" <span style='color:var(--faint)'>→</span> ");
    document.getElementById("topModels").innerHTML = models;
    const ready = data.keys.filter(k => k.cooling_for <= 0).length;
    const total = data.keys.length;
    const cls = ready === total ? "ok" : "warn";
    document.getElementById("statusLeft").innerHTML =
      `<span class="${cls}">●</span> keys ${ready}/${total}` +
      (busyState.on ? " · <span class='warn'>trabajando…</span>" : " · inactivo");
  } catch (e) {
    document.getElementById("statusLeft").textContent = "● servidor sin respuesta";
  }
}

function runCommand(cmd) {
  const c = cmd.toLowerCase();
  if (c === "/ayuda" || c === "/help") {
    block("◆ cerebro", "Comandos:\n  /estado — estado de keys y modelos\n  /memoria — lo que recuerda el agente\n  /limpiar — borra la memoria\n  /ayuda — esta ayuda\n\nEl cerebro usa herramientas reales: archivos · terminal · web · python · PANTALLA (captura, visión con VLM, clic, teclado).\nPuede controlar tu PC: dile por ejemplo \"enfoca Discord y escribe X en la búsqueda\". Tu cursor se moverá de verdad.\nParada de emergencia: mueve el mouse a la ESQUINA SUPERIOR IZQUIERDA (failsafe).");
    return true;
  }
  if (c === "/estado") { refreshStatus(); refreshDetail(); return true; }
  if (c === "/memoria") {
    fetch("/api/status").then(r => r.json()).then(d =>
      block("◆ cerebro", d.memory_summary || "(sin memoria previa)", "dim"));
    return true;
  }
  if (c === "/limpiar") {
    fetch("/api/memory/clear", { method: "POST" }).then(() => {
      block("◆ cerebro", "memoria borrada.", "dim");
      refreshStatus();
    });
    return true;
  }
  return false;
}

async function refreshDetail() {
  try {
    const data = await (await fetch("/api/status")).json();
    const rows = data.keys.map(k =>
      `  ${k.label} ····${k.suffix}  ${k.cooling_for > 0 ? "(cooldown " + Math.round(k.cooling_for) + "s · " + (k.last_error || "?") + ")" : "lista"}`);
    block("◆ cerebro", ["keys:", ...rows].join("\n"), "dim");
  } catch (e) { block("◆ cerebro", "sin respuesta del servidor", "err"); }
}

const history = [];
let hIndex = -1;

async function send(text) {
  if (busyState.on) { block("◆ cerebro", "ya hay una tarea en curso…", "dim"); return; }
  busyState.on = true;
  block("❯ tú", text);
  thinkStart();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    if (res.status === 409) {
      thinkStop();
      block("◆ cerebro", "ya hay una tarea en curso, espera a que termine.", "err");
      busyState.on = false; refreshStatus(); return;
    }
    await res.json();
    pollJob();
  } catch (e) {
    thinkStop();
    block("◆ cerebro", "error de conexión con el servidor local: " + e, "err");
    busyState.on = false;
  }
}

function pollJob() {
  let cursor = 0;
  let sawFinal = false;
  const timer = setInterval(async () => {
    let data;
    try {
      data = await (await fetch("/api/job?since=" + cursor)).json();
    } catch (e) { return; }
    for (const ev of data.events) {
      cursor++;
      if (ev.type === "tool") {
        toolLine(ev.tool, ev.args);
        const resText = String(ev.result || "");
        if (resText.startsWith("[error]")) noteLine(resText, "");
      } else if (ev.type === "answer") {
        noteLine("subagente respondió (" + (ev.steps || "?") + " pasos)");
      } else if (ev.type === "retry") {
        const label = String(ev.model || "").split("/").pop();
        const wait = Number(ev.wait) || 0;
        const tail = wait ? ` · espera ${Math.round(wait)}s` : "";
        noteLine(`nvidia ${ev.status} · ${label} · ${ev.key}${tail}`);
      } else if (ev.type === "final") {
        sawFinal = true;
        thinkStop();
        block("◆ cerebro", ev.content, "");
      } else if (ev.type === "error") {
        thinkStop();
        block("◆ cerebro", "error: " + ev.content, "err");
      } else if (ev.type === "done") {
        clearInterval(timer);
        if (!sawFinal) { thinkStop(); block("◆ cerebro", "(sin respuesta final)", "err"); }
        busyState.on = false;
        refreshStatus();
        return;
      }
    }
    scroll();
  }, 700);
}

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    if (text.startsWith("/")) {
      block("❯ tú", text);
      if (!runCommand(text)) block("◆ cerebro", "comando desconocido. usa /ayuda", "dim");
      return;
    }
    history.push(text);
    hIndex = history.length;
    send(text);
  } else if (e.key === "ArrowUp" && !input.value) {
    if (hIndex > 0) { hIndex--; input.value = history[hIndex]; }
  } else if (e.key === "ArrowDown" && hIndex < history.length) {
    hIndex++;
    input.value = history[hIndex] || "";
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.34) + "px";
});

function hero() {
  const b = document.createElement("div");
  b.className = "block"; b.id = "hero";
  b.innerHTML = `<div class="text dim">cerebro listo. delega en subagentes con herramientas reales: archivos · terminal · web · python\nusa /ayuda para comandos.</div>`;
  thread.append(b);
}
hero();
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
